# Reverse proxy putting HTTPS in front of the BankingApp FastAPI backend.
#
# Install to /etc/nginx/conf.d/bankingapp.conf
#
# nginx terminates TLS and forwards plain HTTP to uvicorn on localhost:8000.
# uvicorn itself is unchanged and still bound to 0.0.0.0:8000, so the direct
# http://<ip>:8000 path keeps working alongside this.
#
# This is a copy of what is running on the instance, with certbot's generated
# fragments tidied and commented. certbot writes the listen 443 block, the
# certificate paths and the redirect itself the first time it runs, so this
# file is documentation rather than something to deploy by hand. The
# authoritative version lives on the instance.
#
# The hostname is 54.80.133.45.nip.io. nip.io resolves any
# <ip-address>.nip.io straight back to that address with no DNS records to
# create, which is what makes a real certificate possible: Let's Encrypt will
# not issue for a bare IP, but it will for a name.
#
# THE HOSTNAME IS TIED TO THE ELASTIC IP. If the Elastic IP is ever released
# or reassigned, this name stops resolving to this instance, and the
# certificate has to be reissued for the new <newip>.nip.io name.


# ---------------------------------------------------------------------------
# HTTPS: the real server
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name 54.80.133.45.nip.io;

    # Issued by Let's Encrypt, renewed by the certbot-renew.timer.
    # fullchain.pem is the leaf plus the intermediate; serving the leaf alone
    # makes browsers reject the chain even though the certificate is valid.
    ssl_certificate     /etc/letsencrypt/live/54.80.133.45.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.80.133.45.nip.io/privkey.pem;

    # certbot's maintained protocol and cipher settings, so this file does
    # not carry a hand-written TLS config that quietly goes out of date.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Host carries the name the client asked for, so FastAPI builds
        # correct absolute URLs instead of echoing back 127.0.0.1:8000.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Without this the app believes every request arrived over plain
        # http, because that is what it sees on the loopback hop. Anything
        # that builds a redirect or an absolute link would then send clients
        # back to http and break the padlock.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ---------------------------------------------------------------------------
# HTTP: redirect only
# ---------------------------------------------------------------------------
# Port 80 stays open for two reasons: this redirect, and Let's Encrypt's
# HTTP-01 challenge, which renewal repeats every 60 days. Closing port 80 in
# the security group would let the certificate silently fail to renew.
server {
    listen 80;
    listen [::]:80;

    server_name 54.80.133.45.nip.io;

    if ($host = 54.80.133.45.nip.io) {
        return 301 https://$host$request_uri;
    }

    # Anything reaching port 80 under a different name is not this app.
    return 404;
}
